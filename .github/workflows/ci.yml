name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Prevent a torch/loky race that segfaults on shutdown when Chroma and
  # sentence-transformers are both loaded in the same Python process.
  TOKENIZERS_PARALLELISM: "false"
  OMP_NUM_THREADS: "1"
  ANTHROPIC_API_KEY: "dummy-for-ci"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,app]"

      - name: Ruff lint
        run: ruff check src tests apps scripts

      - name: Bootstrap demo artifacts (train models + generate personas + index KB)
        run: python scripts/bootstrap_demo.py

      - name: Pytest — analytics
        run: pytest tests/analytics -q

      - name: Pytest — hospitality (per-file, avoids py3.14 chroma+torch shutdown segfault)
        run: |
          set -e
          for f in tests/hospitality/test_*.py; do
            echo "=== $f ==="
            pytest "$f" -q
          done

      - name: Run hospitality eval harness
        run: python scripts/run_hospitality_eval.py
